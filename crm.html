<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CRM Armadillo">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>CRM Armadillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --card2:#F2F2F7; --text:#1D1D1F; --text2:#6E6E73; --text3:#AEAEB2;
  --sep:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --accent:#1F6F6B; --accent-tint:rgba(31,111,107,.11); --madera:#B5803F; --madera-tint:rgba(181,128,63,.13);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --purple:#AF52DE; --indigo:#5856D6; --teal:#30B0C7; --gray:#8E8E93;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --blur:rgba(249,249,251,.82);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --text:#F5F5F7; --text2:#98989D; --text3:#636366;
    --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
    --accent:#3FA39D; --accent-tint:rgba(63,163,157,.18); --madera:#D9A866; --madera-tint:rgba(217,168,102,.16);
    --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --purple:#BF5AF2; --indigo:#5E5CE6; --teal:#40C8E0;
    --shadow:none; --blur:rgba(22,22,24,.78); color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb, var(--accent) 45%, transparent);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.oculto{display:none !important}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:360px;text-align:center}
.login-card .logo{width:84px;height:84px;border-radius:22px;margin:0 auto;display:grid;place-items:center;background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.login-card .logo svg{width:44px;height:44px}
.login-card h1{margin-top:22px;font-size:28px;font-weight:700;letter-spacing:-.025em}
.login-card p{margin-top:6px;color:var(--text2)}
.login-card form{margin-top:28px;display:grid;gap:12px}
.campo{width:100%;height:50px;border-radius:12px;border:0;background:var(--card);padding:0 16px;font-size:17px;box-shadow:var(--shadow)}
.campo:focus{outline:2px solid var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:12px;background:var(--accent);color:#fff;font-size:17px;font-weight:600}
.btn:active{opacity:.85}
.btn.sec{background:var(--fill);color:var(--accent)}
.btn.chico{height:36px;padding:0 14px;font-size:15px;border-radius:10px}
.error{color:var(--red);font-size:14px;min-height:18px}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.lateral{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--sep);background:var(--bg);display:flex;flex-direction:column;gap:4px}
.marca{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.marca .m{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.marca .m svg{width:20px;height:20px}
.marca b{display:block;font-size:15px;font-weight:600}
.marca span{display:block;font-size:12px;color:var(--text2)}
.nav-item{display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border-radius:9px;font-size:15px;color:var(--text);text-align:left;width:100%}
.nav-item svg{color:var(--accent)}
.nav-item:hover{background:var(--fill2)}
.nav-item[aria-current="page"]{background:var(--accent);color:#fff}
.nav-item[aria-current="page"] svg{color:#fff}
.nav-item .badge{margin-left:auto}
.lateral .pie{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--sep);display:grid;gap:8px;font-size:12px;color:var(--text2)}
.lateral .pie button{text-align:left;color:var(--accent);font-size:14px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:inline-grid;place-items:center}
.nav-item[aria-current="page"] .badge{background:#fff;color:var(--accent)}

.principal{min-width:0;padding:28px 36px 60px;max-width:1120px;width:100%}
.encabezado{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.encabezado h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.encabezado p{color:var(--text2);margin-top:4px;font-size:15px}
.icono-btn{width:36px;height:36px;border-radius:99px;background:var(--fill);color:var(--accent);display:grid;place-items:center;flex:none}
.icono-btn.girando svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.demo-aviso{display:flex;gap:10px;align-items:center;background:var(--madera-tint);color:var(--text);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:18px}
.demo-aviso b{font-weight:600}

/* Tabs móvil */
.tabbar{display:none}

/* ---------- Componentes ---------- */
.grupo-titulo{font-size:13px;color:var(--text2);text-transform:none;margin:26px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.grupo-titulo b{font-size:20px;color:var(--text);font-weight:700;letter-spacing:-.02em}
.lista{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.fila{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:60px;width:100%;text-align:left;position:relative}
.fila + .fila::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--sep)}
.fila:active,.fila:hover{background:var(--fill2)}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:14px;font-weight:600;color:#fff;background:var(--gray)}
.avatar.Alta{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000))}
.avatar.Media{background:linear-gradient(160deg,var(--madera),color-mix(in srgb,var(--madera) 70%,#000))}
.avatar.Baja{background:linear-gradient(160deg,#9A9AA0,#6E6E73)}
.fila .txt{flex:1;min-width:0;display:block}
.fila .t1{font-size:16px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .t2{display:block;font-size:13.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.fila .der{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.fila .tiempo{font-size:13px;color:var(--text2)}
.fila .tiempo.tarde{color:var(--red);font-weight:500}
.fila .chev{color:var(--text3);width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.e-Nuevo{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.pill.e-Contactado{background:color-mix(in srgb,var(--indigo) 14%,transparent);color:var(--indigo)}
.pill.e-Visita-agendada{background:color-mix(in srgb,var(--orange) 16%,transparent);color:color-mix(in srgb,var(--orange) 80%,var(--text))}
.pill.e-Visita-pagada{background:color-mix(in srgb,var(--green,#30a46c) 16%,transparent);color:color-mix(in srgb,var(--green,#30a46c) 80%,var(--text))}
.pill.e-Visita-realizada{background:color-mix(in srgb,var(--teal) 16%,transparent);color:color-mix(in srgb,var(--teal) 75%,var(--text))}
.pill.e-Propuesta-enviada{background:color-mix(in srgb,var(--purple) 14%,transparent);color:var(--purple)}
.pill.e-Ganado{background:color-mix(in srgb,var(--green) 16%,transparent);color:color-mix(in srgb,var(--green) 75%,var(--text))}
.pill.e-Perdido{background:var(--fill);color:var(--text2)}
.pill.visita{background:var(--madera-tint);color:var(--madera)}
.pill.wa{background:color-mix(in srgb,var(--green) 15%,transparent);color:color-mix(in srgb,var(--green) 70%,var(--text))}
.pill.wa svg{width:13px;height:13px;stroke-width:2}
.wa-ok{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--green) 16%,transparent);color:color-mix(in srgb,var(--green) 70%,var(--text));flex:none}
.wa-ok svg{width:13px;height:13px;stroke-width:2.2}
.accion.hecho{color:var(--text2)}
.aviso-wa{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--green) 11%,transparent);font-size:13.5px;line-height:1.4}
.aviso-wa svg{width:18px;height:18px;color:color-mix(in srgb,var(--green) 70%,var(--text));margin-top:1px}
.punto{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.punto.Alta{background:var(--accent)}.punto.Media{background:var(--madera)}.punto.Baja{background:var(--text3)}
.vacio{padding:34px 20px;text-align:center;color:var(--text2)}
.vacio svg{width:34px;height:34px;color:var(--text3);margin:0 auto 10px;display:block}
.vacio b{display:block;color:var(--text);font-weight:600;margin-bottom:2px}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);text-align:left}
.tile .et{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
.tile .et svg{width:16px;height:16px;color:var(--accent)}
.tile .num{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1.05}
.tile .sub{font-size:12.5px;color:var(--text2);margin-top:4px}
.tiles.seis{grid-template-columns:repeat(3,minmax(0,1fr))}

.segmentado{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.segmentado button{height:30px;padding:0 14px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--text)}
.segmentado button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

.buscador{position:relative;margin-bottom:12px}
.buscador svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text2)}
.buscador input{width:100%;height:38px;border-radius:10px;border:0;background:var(--fill);padding:0 12px 0 34px;font-size:16px}
.buscador input::placeholder{color:var(--text2)}
.buscador input:focus{outline:2px solid var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip .n{color:var(--text2);font-weight:500}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.conteo{font-size:13px;color:var(--text2);margin:0 4px 8px}

.tarjeta{background:var(--card);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.tarjeta h2{font-size:17px;font-weight:600;letter-spacing:-.015em}
.tarjeta .ayuda{font-size:13px;color:var(--text2);margin-top:3px}
.rejilla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.rejilla .ancho{grid-column:1 / -1}
.barra-fila{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 54px 46px;gap:10px;align-items:center;padding:8px 0;font-size:14px}
.barra-fila + .barra-fila{border-top:1px solid var(--sep)}
.barra-fila .nom{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-fila .nom small{display:block;font-size:12px;color:var(--text2)}
.barra{height:10px;border-radius:99px;background:var(--fill2);overflow:hidden}
.barra i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.barra-fila .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.barra-fila .p{text-align:right;font-variant-numeric:tabular-nums;color:var(--text2);font-size:13px}
.barra-fila.alerta .barra i{background:var(--orange)}
.etiqueta-alerta{display:inline-block;line-height:1.45;margin-top:12px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--orange) 13%,transparent);color:var(--text);font-size:13.5px}
.etiqueta-alerta b{font-weight:600}
.tabla{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.tabla th{font-size:12px;color:var(--text2);font-weight:500;text-align:right;padding:6px 4px;border-bottom:1px solid var(--sep)}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla td{padding:10px 4px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--sep)}
.tabla tr:last-child td{border-bottom:0}
.tabla td:first-child{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desglose{display:grid;gap:2px;margin-top:8px}
.desglose .barra-fila{grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) 34px}
.pipe{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.pipe::-webkit-scrollbar{display:none}
.pipe button{flex:none;min-width:112px;background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;box-shadow:var(--shadow)}
.pipe button b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
.pipe button span{font-size:12.5px;color:var(--text2)}
.pipe button[aria-pressed="true"]{outline:2px solid var(--accent)}

/* ---------- Ficha (sheet) ---------- */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.velo.abierto{opacity:1;pointer-events:auto}
.ficha[hidden]{display:none}
.ficha{position:fixed;z-index:60;background:var(--bg);display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.32,.72,0,1)}
@media (min-width:901px){
  .ficha{top:12px;right:12px;bottom:12px;width:440px;border-radius:18px;transform:translateX(calc(100% + 24px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .ficha.abierta{transform:none}
}
.ficha-cab{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.ficha-cab .grab{display:none}
.ficha-cab button{color:var(--accent);font-size:17px;font-weight:600}
.ficha-cuerpo{overflow-y:auto;padding:4px 16px 40px;flex:1;-webkit-overflow-scrolling:touch}
.persona{text-align:center;padding:6px 0 4px}
.persona .avatar{width:76px;height:76px;font-size:28px;margin:0 auto}
.persona h2{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:10px}
.persona p{color:var(--text2);font-size:14px;margin-top:2px}
.persona .pills{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.siguiente{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-tint);font-size:14px;line-height:1.4}
.siguiente svg{color:var(--accent);margin-top:1px}
.siguiente.vencido{background:color-mix(in srgb,var(--red) 12%,transparent)}
.siguiente.vencido svg{color:var(--red)}
.siguiente b{display:block;font-weight:600}
.siguiente span{color:var(--text2)}
.agente-estado{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;font-size:14px;line-height:1.4}
.agente-estado svg{color:var(--accent);margin-top:1px}
.agente-estado b{display:block;font-weight:600}
.agente-estado span{color:var(--text2)}
.chat{padding:10px 12px;display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto;background:var(--card2)}
.burbuja{max-width:85%;padding:7px 10px 6px;border-radius:12px;font-size:14px;line-height:1.38;white-space:pre-wrap;word-wrap:break-word}
.burbuja small{display:block;font-size:11px;color:var(--text2);margin-top:3px}
.burbuja.cliente{align-self:flex-start;background:var(--card)}
.burbuja.asistente{align-self:flex-end;background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.burbuja.equipo{align-self:flex-end;background:color-mix(in srgb,var(--madera) 20%,var(--card))}
.burbuja.nota{align-self:center;background:none;color:var(--text2);font-size:12px;text-align:center;padding:2px 6px}
.agente-btns{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.accion{background:var(--card);border-radius:12px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--accent);box-shadow:var(--shadow)}
.accion svg{width:22px;height:22px}
.seccion-t{font-size:13px;color:var(--text2);margin:22px 4px 7px;text-transform:uppercase;letter-spacing:.02em}
.caja{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.dato{display:flex;justify-content:space-between;gap:16px;padding:11px 14px;font-size:15px;position:relative}
.dato + .dato::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep)}
.dato span{color:var(--text2);flex:none}
.dato b{font-weight:500;text-align:right}
.etapas{display:flex;gap:6px;flex-wrap:wrap;padding:12px}
.etapas button{height:32px;padding:0 12px;border-radius:99px;background:var(--fill2);font-size:13.5px;font-weight:500}
.etapas button[aria-pressed="true"]{background:var(--accent);color:#fff}
.visita-caja{display:flex;align-items:center;gap:12px;padding:12px 14px}
.cal{width:48px;height:50px;border-radius:10px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;overflow:hidden}
.cal small{font-size:10.5px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
.cal b{font-size:21px;font-weight:600;line-height:1}
.visita-caja .txt{flex:1}
.visita-caja .txt b{display:block;font-weight:600}
.visita-caja .txt span{font-size:13.5px;color:var(--text2)}
.linea-form{display:flex;gap:8px;align-items:center;padding:10px 12px}
.linea-form input,.linea-form textarea{flex:1;min-width:0;border:0;background:var(--fill2);border-radius:9px;padding:9px 11px;font-size:16px}
.linea-form textarea{min-height:64px;resize:vertical}
.linea-form input:focus,.linea-form textarea:focus{outline:2px solid var(--accent)}
.rapidos{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
.rapidos button{height:30px;padding:0 11px;border-radius:99px;background:var(--fill2);font-size:13px;color:var(--accent);font-weight:500}
.notas{padding:4px 14px 10px}

/* ---------- Utilidades de fecha y formato ---------- */
const DIA = 864e5;
function aFecha(v){
  if(v === "" || v == null) return null;
  if(typeof v === "number") return new Date(v);
  const s = String(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){ const [a,m,d] = s.split("-").map(Number); return new Date(a, m - 1, d); }
  const d = new Date(s); return isNaN(d) ? null : d;
}

function isoDia(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function hace(ms){
  if(!ms) return "";
  const s = (Date.now() - ms) / 1000;
  if(s < 60) return "ahora";
  if(s < 3600) return `hace ${Math.floor(s/60)} min`;
  if(s < 86400) return `hace ${Math.floor(s/3600)} h`;
  if(s < 172800) return "ayer";
  if(s < 7 * 86400) return `hace ${Math.floor(s/86400)} días`;
  return new Date(ms).toLocaleDateString("es-MX", { day:"numeric", month:"short" });
}
const fmtNum = n => Number(n || 0).toLocaleString("es-MX");

function normLead(l){
  const tel = String(l["WhatsApp"] ?? "").replace(/\D/g, "").replace(/^52(?=\d{10}$)/, "");

    intentos: Number(l["Intentos"]) || 0, motivo: l["Motivo perdido"] || "", token: l["Token"] || ""
  };

function normSesion(s){
  return {
    inicio: aFecha(s["Inicio"])?.getTime() || 0, paso: Number(s["Paso máximo"]) || 0,
    form: s["Llegó al formulario"] === "Sí", datos: s["Dejó datos"] === "Sí", visita: s["Apartó visita"] === "Sí",
    wa: s["Abrió WhatsApp"] === "Sí", folio: String(s["Folio"] || ""), anuncio: s["Anuncio"] || "", campana: s["Campaña"] || "", dispositivo: s["Dispositivo"] || "",
    info: Number(s["Info máxima"]) || 0, infoAntes: s["Vio info antes"] === "Sí", medInfo: s["Info máxima"] !== undefined && s["Info máxima"] !== ""
  };
}
/* Sesiones de prueba: dejaron datos pero su lead ya no existe (se borró del Sheet). No cuentan en métricas. */
function limpiarSesiones(ses, leads){
  const folios = new Set(leads.map(l => l.folio));
  return ses.filter(x => !(x.folio && (x.datos || x.visita) && !folios.has(x.folio)));
}
const apartoVisita = l => l.estado === "Visita apartada";
const activo = l => l.seguimiento !== "Ganado" && l.seguimiento !== "Perdido";
const porAtender = l => l.seguimiento === "Nuevo" && !l.ultimoContacto;

/* ---------- Tiempos de respuesta (semáforo) ----------
   De día (8 a 20 h): 2 horas para contactar. De noche: antes de las 10 am. Domingo pasa al lunes 10 am. */
function limiteSLA(ms){
  const d = new Date(ms), h = d.getHours(), lim = new Date(ms);
  if(h >= 20){ lim.setDate(lim.getDate() + 1); lim.setHours(10,0,0,0); }
  else if(h < 8) lim.setHours(10,0,0,0);
  else lim.setTime(ms + 2 * 36e5);
  if(lim.getDay() === 0){ lim.setDate(lim.getDate() + 1); lim.setHours(10,0,0,0); }
  return lim.getTime();
}
function fmtDur(ms){
  const m = Math.max(1, Math.round(Math.abs(ms) / 6e4));
  if(m < 60) return m + " min";
  const h = Math.floor(m / 60);
  if(h < 24) return h + " h" + (h < 5 && m % 60 ? " " + (m % 60) + " min" : "");
  return Math.round(h / 24) + (Math.round(h / 24) === 1 ? " día" : " días");
}
const contactoDe = l => l.primerContacto || l.ultimoContacto;
function sla(l){
  const c = contactoDe(l);
  if(c) return { estado: "ok", clase: c <= limiteSLA(l.fecha) ? "verde" : "ambar", txt: "Respondió en " + fmtDur(c - l.fecha) };
  if(!activo(l)) return null;
  const falta = limiteSLA(l.fecha) - Date.now();
  if(falta < 0) return { estado: "vencido", clase: "rojo", txt: "Vencido " + fmtDur(falta) };
  return { estado: "atiempo", clase: falta < 30 * 6e4 ? "ambar" : "verde", txt: "Vence en " + fmtDur(falta) };
}
const fueraTiempo = l => sla(l)?.estado === "vencido";
const sinAsignar = l => activo(l) && !l.responsable;
const colorResp = p => { const i = EQUIPO.indexOf(p); return i < 0 ? "rx" : "r" + i; };
const inicResp = p => p ? iniciales(p.replace(/^Arq\.\s*/, "")) : "?";
const linkAsesor = l => new URL("asesor.html", location.href).href.split("?")[0] + "?f=" + encodeURIComponent(l.folio) + "&k=" + (l.token || (DEMO ? "demo" : ""));
const burbuja = p => `<span class="resp ${colorResp(p)}" title="${p ? "Responsable: " + esc(p) : "Sin responsable"}">${esc(inicResp(p))}</span>`;

/* ---------- API ---------- */
async function api(params){
  if(DEMO) return demoApi(params);
  const url = API + "?" + new URLSearchParams(Object.assign({ clave }, params)).toString();
  const r = await fetch(url, { cache: "no-store" });
  if(!r.ok) throw new Error("red");
  return r.json();
}
async function sincronizar(manual){
  if(cargando) return;
  cargando = true; girar(true);
  try{
    const r = await api({ accion: "datos" });
    if(!r.ok){ if(r.error === "clave"){ salir("La clave no es correcta."); return; } throw new Error(r.error); }
    datos.leads = r.leads.map(normLead).sort((a,b) => b.fecha - a.fecha);
    datos.sesiones = limpiarSesiones(r.sesiones.map(normSesion), datos.leads);
    ultimaSync = Date.now();
    render();
    if(manual) toast("Datos actualizados");
  }catch(e){
    toast("No pudimos conectar con el CRM. Revisa tu conexión e inténtalo de nuevo.");
    if(!ultimaSync) $("principal").innerHTML = `<div class="vacio">${I.ref}<b>Sin conexión</b>No pudimos cargar los datos.<br><br><button class="btn chico" data-accion="actualizar">Reintentar</button></div>`;
  }finally{ cargando = false; girar(false); actualizarSync(); }
}
async function guardar(folio, cambios, exito){
  const l = datos.leads.find(x => x.folio === folio); if(!l) return;
  const antes = Object.assign({}, l);
  aplicarLocal(l, cambios); render(); pintarFicha();
  try{
    const r = await api({ accion: "guardar", folio, cambios: JSON.stringify(cambios) });
    if(!r.ok) throw new Error(r.error);
    Object.assign(l, normLead(r.lead)); render(); pintarFicha();
    if(exito) toast(exito);
  }catch(e){
    Object.assign(l, antes); render(); pintarFicha();
    toast("No se guardó. Revisa tu conexión e inténtalo de nuevo.");
  }
}
function aplicarLocal(l, c){
  const sello = new Date().toLocaleString("es-MX", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
  if(c.seguimiento) l.seguimiento = c.seguimiento;
  if(c.contacto) l.ultimoContacto = Date.now();
  if(c.proximo !== undefined) l.proximo = aFecha(c.proximo);
  if(c.monto !== undefined) l.monto = Number(c.monto) || 0;
  if(c.responsable !== undefined){ l.responsable = c.responsable; l.asignado = c.responsable ? Date.now() : 0; }
  if(c.contacto && !l.primerContacto) l.primerContacto = Date.now();
  if(c.intento) l.intentos = (l.intentos || 0) + 1;
  if(c.motivo !== undefined) l.motivo = c.motivo;
  if(c.nota) l.notas = (l.notas ? l.notas + "\n" : "") + sello + " · " + c.nota;
}

/* ---------- Navegación ---------- */
function ir(v){ vista = v; store.set("ad_crm_vista", v); render(); window.scrollTo(0,0); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ir],[data-accion],[data-lead],[data-filtro],[data-periodo],[data-etapa-filtro],[data-embudo]");
  if(!b) return;
  if(b.dataset.ir) ir(b.dataset.ir);
  else if(b.dataset.lead) abrirFicha(b.dataset.lead);
  else if(b.dataset.filtro){ filtro = b.dataset.filtro; etapaFiltro = ""; render(); }
  else if(b.dataset.etapaFiltro !== undefined){ etapaFiltro = etapaFiltro === b.dataset.etapaFiltro ? "" : b.dataset.etapaFiltro; filtro = "todos"; render(); }
  else if(b.dataset.periodo){ periodo = b.dataset.periodo; store.set("ad_crm_periodo", periodo); render(); }
  else if(b.dataset.embudo){ embudoAnuncio = b.dataset.embudo; render(); }
  else if(b.dataset.accion === "actualizar") sincronizar(true);
  else if(b.dataset.accion === "salir") salir();
});

function render(){
  document.querySelectorAll("[data-ir]").forEach(b => b.setAttribute("aria-current", b.dataset.ir === vista ? "page" : "false"));
  const n = pendientes().total;
  document.querySelectorAll("[data-badge]").forEach(b => { b.textContent = n; b.classList.toggle("oculto", !n); });
  const ne = datos.leads.filter(l => fueraTiempo(l)).length;
  document.querySelectorAll("[data-badge-eq]").forEach(b => { b.textContent = ne; b.classList.toggle("oculto", !ne); });
  const html = vista === "leads" ? vistaLeads() : vista === "metricas" ? vistaMetricas() : vista === "equipo" ? vistaEquipo() : vistaHoy();
  const p = $("principal");
  const enfocado = document.activeElement && document.activeElement.id === "buscar";
  const pos = enfocado ? document.activeElement.selectionStart : 0;
  p.innerHTML = (DEMO ? `<div class="demo-aviso">${I.ojo}<span><b>Datos de ejemplo.</b> Así se verá el CRM con leads reales.</span></div>` : "") + html;
  if(enfocado){ const i = $("buscar"); if(i){ i.focus(); i.setSelectionRange(pos, pos); } }
  const ib = $("buscar"); if(ib) ib.oninput = () => { busqueda = ib.value; render(); };
}

function encabezado(titulo, sub){
  return `<header class="encabezado"><div><h1>${titulo}</h1>${sub ? `<p>${sub}</p>` : ""}</div>
    <button class="icono-btn" data-accion="actualizar" aria-label="Actualizar datos" id="btn-ref">${I.ref}</button></header>`;
}
function girar(si){ document.querySelectorAll("#btn-ref").forEach(b => b.classList.toggle("girando", si)); }
function actualizarSync(){ $("sync-lat").textContent = ultimaSync ? "Actualizado " + hace(ultimaSync) : "Sin sincronizar"; }

/* ---------- Filas ---------- */
function filaLead(l, extra){
  const sub = extra || [l.zona, rangoTxt(l.inversion), l.tiempo].filter(Boolean).join(" · ");
  const s = sla(l), urgente = s && s.estado !== "ok";
  return `<button class="fila" data-lead="${esc(l.folio)}">
    <span class="avatar ${esc(l.prioridad)}">${esc(iniciales(l.nombre))}</span>
    <span class="txt"><span class="t1">${esc(l.nombre)}${l.escribio ? ` <span class="wa-ok" title="Ya le escribió a Daniel por WhatsApp" aria-label="Ya le escribió a Daniel por WhatsApp">${I.wa}</span>` : ""}${apartoVisita(l) ? ` <span class="pill visita">Apartó visita</span>` : ""}</span><span class="t2">${esc(sub)}</span></span>
    <span class="der${urgente ? " urg" : ""}"><span class="pill ${claseEtapa(l.seguimiento)}">${esc(l.seguimiento)}</span>${urgente ? `<span class="sla ${s.clase}">${s.txt}</span>` : `<span class="tiempo">${hace(l.fecha)}</span>`}</span>
    ${I.chev}</button>`;
}
function rangoTxt(inv){
  return String(inv || "").replace(/\$(\d{3}),000/g, "$$$1k").replace(" a ", "–").replace("Más de ", "+").replace("Menos de ", "<");
}
function vacio(titulo, texto){ return `<div class="vacio">${I.ok}<b>${titulo}</b>${texto}</div>`; }

/* ---------- Vista: Hoy ---------- */
function pendientes(){
  const hoy = hoyInicio().getTime(), manana = hoy + DIA;
  const ls = datos.leads;
  const confirmar = ls.filter(l => apartoVisita(l) && l.seguimiento === "Nuevo");
  const nuevos = ls.filter(l => porAtender(l) && !confirmar.includes(l)).sort((a,b) => a.fecha - b.fecha);
  const seguimientos = ls.filter(l => activo(l) && l.proximo && l.proximo.getTime() < manana && !confirmar.includes(l) && !nuevos.includes(l)).sort((a,b) => a.proximo - b.proximo);
  const proximas = ls.filter(l => l.seguimiento === "Visita agendada" && l.visitaFecha && l.visitaFecha.getTime() >= hoy).sort((a,b) => a.visitaFecha - b.visitaFecha);
  return { confirmar, nuevos, seguimientos, proximas, total: confirmar.length + nuevos.length + seguimientos.length };
}
function vistaHoy(){
  const p = pendientes();
  const hoy = hoyInicio().getTime();
  const fecha = new Date().toLocaleDateString("es-MX", { weekday:"long", day:"numeric", month:"long" });
  const leadsHoy = datos.leads.filter(l => l.fecha >= hoy).length;
  const visitasHoy = datos.sesiones.filter(s => s.inicio >= hoy).length;
  const semana = datos.leads.filter(l => l.visitaFecha && l.visitaFecha.getTime() >= hoy && l.visitaFecha.getTime() < hoy + 7*DIA && activo(l)).length;
  let h = encabezado("Hoy", fecha.charAt(0).toUpperCase() + fecha.slice(1));
  const venc = [...p.confirmar, ...p.nuevos].filter(fueraTiempo);
  h += `<div class="tiles">
    <div class="tile ${venc.length ? "rojo" : ""}"><div class="et">${I.persona}Por atender</div><div class="num">${p.total}</div><div class="sub">${venc.length} fuera de tiempo</div></div>
    <div class="tile"><div class="et">${I.inicio}Leads hoy</div><div class="num">${leadsHoy}</div><div class="sub">${fmtNum(visitasHoy)} visitas a la página</div></div>
    <div class="tile ocultable"><div class="et">${I.cal}Visitas esta semana</div><div class="num">${semana}</div><div class="sub">en los próximos 7 días</div></div>
  </div>`;
  const bloque = (titulo, ayuda, arr, extra) => arr.length ? `<div class="grupo-titulo"><b>${titulo}</b><span>${ayuda}</span></div><div class="lista">${arr.map(l => filaLead(l, extra && extra(l))).join("")}</div>` : "";
  if(!p.total && !p.proximas.length){
    h += `<div class="grupo-titulo"><b>Pendientes</b></div><div class="lista">${vacio("Todo al día", "No hay leads por atender. Los nuevos aparecen aquí en cuanto llegan.")}</div>`;
  }
  h += bloque("Fuera de tiempo", "Ya pasaron las 2 horas (o las 10 am si llegó de noche). Atiéndelos primero", venc, l => `Llegó ${hace(l.fecha)}`);
  p.confirmar = p.confirmar.filter(l => !venc.includes(l)); p.nuevos = p.nuevos.filter(l => !venc.includes(l));
  h += bloque("Visitas por confirmar", "Escríbeles para confirmar la dirección", p.confirmar, l => `${l.visitaDia}${l.visitaHora ? ", " + l.visitaHora : ""} · ${l.escribio ? "ya le escribió a Daniel" : l.zona}`);
  h += bloque("Nuevos sin contactar", "Los más antiguos primero", p.nuevos);
  h += bloque("Seguimientos para hoy", "Fecha de próximo contacto vencida o de hoy", p.seguimientos, l => `Contactar: ${l.proximo.toLocaleDateString("es-MX",{day:"numeric",month:"short"})} · ${l.zona}`);
  h += bloque("Próximas visitas", "Visitas técnicas confirmadas", p.proximas, l => `${l.visitaFecha.toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"})}${l.visitaHora ? " · " + l.visitaHora : ""}`);
  return h;
}

const FILTROS = [
  ["todos", "Todos", () => true],
  ["atender", "Por atender", porAtender],
  ["fuera", "Fuera de tiempo", fueraTiempo],
  ["visita", "Apartó visita", apartoVisita],
  ["escribio", "Ya escribió a Daniel", l => l.escribio],

  ["proceso", "En proceso", l => ["Contactado","Visita agendada","Visita pagada","Visita realizada","Propuesta enviada"].includes(l.seguimiento)],
  ["ganados", "Ganados", l => l.seguimiento === "Ganado"],
  ["perdidos", "Perdidos", l => l.seguimiento === "Perdido"]
];

  const q = busqueda.trim().toLowerCase();

  h += `<div class="chips" role="group" aria-label="Filtros">${FILTROS.map(([k, t, fn]) =>
    `<button class="chip" data-filtro="${k}" aria-pressed="${filtro === k && !etapaFiltro}">${t}<span class="n">${datos.leads.filter(fn).length}</span></button>`).join("")}</div>`;
  h += `<p class="conteo">${lista.length === 1 ? "1 lead" : fmtNum(lista.length) + " leads"}${etapaFiltro ? " en " + etapaFiltro : ""}</p>`;

    : `<div class="lista">${datos.leads.length ? vacio("Sin resultados", "Prueba con otro filtro o búsqueda.") : vacio("Aún no hay leads", "Cuando alguien termine el diagnóstico, aparece aquí.")}</div>`;
  return h;

/* ---------- Vista: Métricas ---------- */
function enPeriodo(ms){
  if(periodo === "todo") return true;
  const desde = periodo === "hoy" ? hoyInicio().getTime() : hoyInicio().getTime() - (Number(periodo) - 1) * DIA;
  return ms >= desde;
}
function vistaMetricas(){
  const ses = datos.sesiones.filter(s => enPeriodo(s.inicio));
  const leads = datos.leads.filter(l => enPeriodo(l.fecha));
  const visitas = ses.length;
  const iniciaron = ses.filter(s => s.paso >= 2).length;
  const nLeads = leads.length;
  const apartadas = leads.filter(apartoVisita).length;
  const ganados = leads.filter(l => l.seguimiento === "Ganado");
  const vendido = ganados.reduce((a, l) => a + l.monto, 0);

  let h = encabezado("Métricas", "Landing de cocinas integrales");
  h += `<div class="segmentado" role="group" aria-label="Periodo" style="margin-bottom:16px">${[["hoy","Hoy"],["7","7 días"],["30","30 días"],["todo","Todo"]].map(([k,t]) =>
    `<button data-periodo="${k}" aria-pressed="${periodo === k}">${t}</button>`).join("")}</div>`;
  h += `<div class="tiles seis">

    <div class="tile"><div class="et">${I.inicio}Iniciaron</div><div class="num">${fmtNum(iniciaron)}</div><div class="sub">${pct(iniciaron, visitas)}% contestó al menos una</div></div>
    <div class="tile"><div class="et">${I.persona}Leads</div><div class="num">${fmtNum(nLeads)}</div><div class="sub">${pct(nLeads, visitas)}% de las visitas</div></div>
    <div class="tile"><div class="et">${I.cal}Visitas apartadas</div><div class="num">${fmtNum(apartadas)}</div><div class="sub">${pct(apartadas, nLeads)}% de los leads</div></div>
    <div class="tile"><div class="et">${I.pct}Cierre</div><div class="num">${pct(ganados.length, nLeads)}%</div><div class="sub">${ganados.length} ${ganados.length === 1 ? "venta" : "ventas"} de ${nLeads} leads</div></div>
    <div class="tile"><div class="et">${I.pesos}Vendido</div><div class="num">${fmtCorto(vendido)}</div><div class="sub">monto cerrado registrado</div></div>
  </div>`;

  // Embudo del diagnóstico, con filtro por anuncio
  const SIN_AN = "Sin anuncio";
  const claveAn = s => s.anuncio || SIN_AN;
  const anunciosPer = [...new Set(ses.map(claveAn))].sort((a, b) => (a === SIN_AN) - (b === SIN_AN) || a.localeCompare(b, "es", { numeric: true }));
  if(embudoAnuncio !== "todos" && !anunciosPer.includes(embudoAnuncio)) embudoAnuncio = "todos";
  const sesE = embudoAnuncio === "todos" ? ses : ses.filter(s => claveAn(s) === embudoAnuncio);

  PREGUNTAS.forEach((q, i) => pasos.push([`Contestó ${i + 1}. ${q}`, "", sesE.filter(s => s.paso >= i + 2).length]));

  pasos.push(["Apartó su visita", "", sesE.filter(s => s.visita).length]);
  let peor = -1, peorCaida = 0;
  for(let i = 1; i < pasos.length - 1; i++){ const c = pasos[i - 1][2] - pasos[i][2]; if(c > peorCaida){ peorCaida = c; peor = i; } }
  h += `<div class="rejilla"><div class="tarjeta ancho"><h2>¿En qué parte se quedan?</h2><p class="ayuda">De cada 100 personas que entran, cuántas llegan a cada paso del diagnóstico. Elige un anuncio para ver solo a su gente.</p>`;
  if(anunciosPer.length > 1) h += `<div class="chips" role="group" aria-label="Anuncio" style="margin-top:12px">${[["todos", "Todos", visitas]].concat(anunciosPer.map(a => [a, a, ses.filter(s => claveAn(s) === a).length])).map(([k, t, n]) =>

  if(!visE) h += vacio("Sin visitas en este periodo", "Cambia el periodo o espera a que lleguen visitas.");
  else {
    h += pasos.map(([n, s, v], i) => `<div class="barra-fila ${i === peor ? "alerta" : ""}"><span class="nom">${esc(n)}${s ? `<small>${s}</small>` : ""}</span><span class="barra"><i style="width:${pct(v, visE)}%"></i></span><span class="v">${fmtNum(v)}</span><span class="p">${pct(v, visE)}%</span></div>`).join("");
    if(peor > 0) h += `<p class="etiqueta-alerta">Aquí se va más gente${embudoAnuncio === "todos" ? "" : ` de ${esc(embudoAnuncio)}`}: <b>${pct(peorCaida, pasos[peor - 1][2])}%</b> no pasa de “${esc(pasos[peor][0].replace("Contestó ", ""))}”.</p>`;
  }
  // ¿La información ayuda o distrae?
  const conMed = sesE.filter(s => s.medInfo);
  if(conMed.length >= 5){
    const bajaron = conMed.filter(s => s.info > 0), noBajaron = conMed.filter(s => s.info === 0);
    const antes = conMed.filter(s => s.infoAntes);
    const leadsDe = g => g.filter(s => s.datos || s.paso >= 10).length;
    h += `<h3 style="margin:22px 0 4px;font-size:15px;font-weight:600">¿La información de la página ayuda o distrae?</h3>

    if(!r.ok){ $("error-login").textContent = r.error === "clave" ? "La clave no es correcta." : "No pudimos entrar. Inténtalo de nuevo."; clave = ""; return; }
    store.set("ad_crm_clave", v);
    datos.leads = r.leads.map(normLead).sort((a,b) => b.fecha - a.fecha);
    datos.sesiones = limpiarSesiones(r.sesiones.map(normSesion), datos.leads);
    ultimaSync = Date.now();
    $("login").classList.add("oculto"); $("app").classList.remove("oculto");
    render(); actualizarSync();
  }catch(err){ $("error-login").textContent = "No pudimos conectar. Revisa tu conexión."; clave = ""; }
  finally{ $("btn-entrar").textContent = "Entrar"; }
};
setInterval(() => { if(clave && document.visibilityState === "visible") sincronizar(); }, 60000);
setInterval(actualizarSync, 30000);
document.addEventListener("visibilitychange", () => { if(clave && document.visibilityState === "visible" && Date.now() - ultimaSync > 30000) sincronizar(); });
